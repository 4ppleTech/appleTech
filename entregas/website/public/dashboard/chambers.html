<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppleTech | Câmaras</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard/shared.css">
    <link rel="stylesheet" href="../css/dashboard/chambers.css">
    <link rel="shortcut icon" href="../assets/imgs/favicon.ico" type="image/x-icon">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="dashboard-container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="header">
                <img src="../assets/svgs/logo-recolored.svg" alt="AppleTech Logo" class="logo">
            </div>

            <nav class="navlist">
                <div class="nav-section">
                    <h4>Menu</h4>
                    <a href="./home.html" class="navitem">
                        <i class="fa-solid fa-house"></i>
                        <span>Início</span>
                    </a>
                    <a href="#" class="navitem">
                        <i class="fa-solid fa-warehouse"></i>
                        <span>Câmaras</span>
                    </a>
                    <a href="./alerts.html" class="navitem">
                        <i class="fa-solid fa-warning"></i>
                        <span>Alertas</span>
                    </a>
                    <a href="./team.html" class="navitem">
                        <i class="fa-solid fa-user-group"></i>
                        <span>Equipe</span>
                    </a>
                </div>
                <div class="nav-section">
                    <h4>Outros</h4>
                    <a href="./help.html" class="navitem">
                        <i class="fa-solid fa-ear-listen"></i>
                        <span>Ajuda</span>
                    </a>
                </div>
            </nav>

            <div class="footer">
                <div class="logged-account">
                    <div>
                        <p id="account-username"></p>
                        <span id="account-role"></span>
                    </div>
                </div>
                <button id="logout-btn" onclick="limparSessao()">
                    <i class="fa-solid fa-right-from-bracket" style="rotate: 180deg"></i>
                    <span>Sair</span>
                </button>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="content">
            <div class="header">
                <h1>Dashboard - Câmaras</h1>
                <span id="current-date"></span>
            </div>

            <main class="main">
                <!-- FORMULÁRIO DE CÂMARA -->
                <div class="new-chamber-container">
                    <div class="chamber-container-content">
                        <img src="../assets/svgs/team-work.svg" alt="Nova Câmara">
                        <button class="chamber-form-toggler">
                            Nova Câmara <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                    <form id="new-chamber-form" data-form-open="false" data-edit-id="" style="display: none;">
                        <div class="form-header">
                            <h2 id="form-title">Adicionar Nova Câmara</h2>
                        </div>
                        <div class="form-body">
                            <div class="field-group">
                                <div class="field" style="width: 50%;">
                                    <label for="ipt-local-instalacao" class="field-label">Local de Instalação
                                        <span>*</span></label>
                                    <input id="ipt-local-instalacao" type="text" class="field-input"
                                        placeholder="Ex: Ala Oeste" required>
                                </div>
                                <!-- <div class="field">
                                    <label for="ipt-observacao" class="field-label">Observação</label>
                                    <input id="ipt-observacao" type="text" class="field-input"
                                        placeholder="Ex: recém-instalada">
                                </div> -->
                                <div class="field">
                                    <label for="ipt-apelido" class="field-label">Apelido <span>*</span></label>
                                    <input id="ipt-apelido" type="text" class="field-input" placeholder="Ex: C-04"
                                        required>
                                </div>
                            </div>
                            <div class="field-group">
                                <div class="field">
                                    <label for="ipt-volume" class="field-label">Volume (m³) <span>*</span></label>
                                    <input id="ipt-volume" type="number" class="field-input" placeholder="Ex: 48"
                                        required>
                                </div>
                                <div class="field">
                                    <label for="ipt-kg-macas" class="field-label">Quantidade de Maçãs (Kg)
                                        <span>*</span></label>
                                    <input id="ipt-kg-macas" type="number" class="field-input" placeholder="Ex: 500"
                                        required>
                                </div>
                                <div class="field">
                                    <label for="ipt-situacao" class="field-label">Situação <span>*</span></label>
                                    <select id="ipt-situacao" class="field-input">
                                        <option value="Ativo" default>Ativo</option>
                                        <option value="Inativo">Inativo</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="form-footer">
                            <button type="reset" class="chamber-form-toggler" id="btn-cancel-form">Cancelar</button>
                            <button type="submit" class="chamber-form-submit-btn"
                                id="btn-submit-form">Adicionar</button>
                        </div>
                    </form>
                </div>

                <!-- LISTA DE CÂMARAS -->
                <div class="chamber-list-results">
                    <h1>Total de Câmaras</h1>
                    <span id="chambers-count">0</span>
                </div>

                <ul id="chamber-list">
                    <!-- Câmaras carregadas dinamicamente -->
                </ul>
            </main>
        </div>
    </div>

    <script src="../scripts/utils/sessao.js"></script>
    <script src="../scripts/utils/formatar-data.js"></script>
    <script type="module">
        import { storage } from "../scripts/utils/storage.js";
        import { carregarInfoSidebar } from "../scripts/carregar-sidebar.js";
        import { carregarGraficoCamara, atualizarGraficoCamara } from "../scripts/carregar-grafico-camaras.js";

        document.addEventListener("DOMContentLoaded", () => {
            const userData = storage.get("APPLETECH_USER");

            if (!userData) {
                console.warn("Aviso: Dados de usuário não encontrados. Redirecionando...");
                setTimeout(() => { window.location = "../login.html"; }, 250);
                return;
            };

            carregarInfoSidebar();
            configurarFormularioCamara(userData);
            
            fetch(`/camaras/${userData.empresaId}`)
            .then((response) => response.json())
            .then((data) => {
                storage.set("APPLETECH_CAMARAS", data);
                carregarCamaras(data);
            })
            .catch((error) => {
                console.error(error);
            });
        });

        // === FORMULÁRIO CÂMARA (CADASTRO/EDIÇÃO) === //
        function configurarFormularioCamara(userData) {
            const form = document.getElementById("new-chamber-form");

            // Abrir/Fechar Formulário
            document.querySelectorAll(".chamber-form-toggler").forEach(btn => {
                btn.addEventListener("click", alternarFormularioCamara);
            });

            // Muda estado para "cadastro" ao resetar formulário
            form.addEventListener("reset", () => {
                form.dataset.editId = "";
                definirModoFormularioCamara("cadastro");
            });

            // Adiciona Função de Envio
            form.addEventListener("submit", (e) => {
                e.preventDefault();
                enviarFormularioCamara(form, userData);
            });
        }

        function definirModoFormularioCamara(modo, apelido = "") {
            const titulo = document.getElementById("form-title");
            const btnSubmit = document.getElementById("btn-submit-form");

            if (modo === "edicao") {
                titulo.innerText = `Editar Câmara: ${apelido}`;
                btnSubmit.innerText = "Salvar Alterações";
            } else {
                titulo.innerText = "Adicionar Nova Câmara";
                btnSubmit.innerText = "Adicionar";
            }
        }

        function enviarFormularioCamara(form, userData) {
            const editId = form.dataset.editId;
            const isEdicao = !!editId;
            const dados = {
                id_empresa: userData.empresaId,
                local_instalacao: document.getElementById("ipt-local-instalacao").value.trim(),
                // observacao: document.getElementById("ipt-observacao").value.trim(),
                apelido: document.getElementById("ipt-apelido").value.trim(),
                volume: Number(document.getElementById("ipt-volume").value),
                kg_macas: Number(document.getElementById("ipt-kg-macas").value),
                situacao: document.getElementById("ipt-situacao").value
            };

            console.log(`Formulário de câmara (${isEdicao ? "Edição" : "Cadastro"}):`, dados);
            fetch(`/camaras/${isEdicao ? `/atualizar/${editId}` : "/cadastrar"}`, {
                method: isEdicao ? "PUT" : "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dados)
            })
                .then((res) => {
                    if (!res.ok) {
                        throw new Error("Erro ao Cadastrar Câmara!");
                    }
                    return res.json();
                })
                .then((camaras) => {
                    // Fecha Formulário e Reseta Inputs
                    alternarFormularioCamara();
                    form.reset();

                    storage.set("APPLETECH_CAMARAS", camaras)
                    // Recarrego lista de Câmaras
                    carregarCamaras(camaras);
                })
                .catch((error) => {
                    console.log(error)
                    // mostrar alguma mensagem...
                });
        }

        // === LISTA DE CÂMARAS === // 
        function carregarCamaras(camaras) {
            const chamberList = document.getElementById("chamber-list");
            document.getElementById("chambers-count").innerText = camaras.length;

            chamberList.innerHTML = "";
            camaras.forEach(camara => {
                const { card, chamberId } = criarCardCamara(camara);
                const idCamaraNumerico = parseInt(chamberId.replace("c-", ""));

                card.querySelector("#chamber-toggler")
                    .addEventListener("click", () => alternarVisibilidadeCamara(chamberId));
                card.querySelector("#chamber-edit-toggler")
                    .addEventListener("click", () => abrirEdicaoCamara(camara));

                const chamberBtnGroup = card.querySelectorAll(".btn-group button");
                chamberBtnGroup.forEach((btn) => {
                    btn.addEventListener("click", () => {
                        chamberBtnGroup.forEach((btn) => btn.classList.remove("active"));
                        btn.classList.add("active");
                    });
                });

                chamberList.appendChild(card);
                carregarListaKPI(chamberId);
                
                // Carrega Gráfico, Inicia Intervalo de Leitura
                carregarGraficoCamara(chamberId, '1');
                const chamberTimer = setInterval(() => {
                    if(document.getElementById(chamberId).dataset.chamberCard === 'open') {
                        atualizarGraficoCamara(chamberId);
                        carregarListaKPI(chamberId);
                    }
                }, 1000);
                document.getElementById(`chart-${chamberId}`).dataset.timerId = chamberTimer;


                // Configura Sensores (Cadastro/Edição) para Câmara
                const sensorFormId = `sensor-form-${idCamaraNumerico}`;
                const sensorForm = document.getElementById(sensorFormId);

                const adicionarSensorBtn = card.querySelector(".add-sensor-btn")
                adicionarSensorBtn.addEventListener("click", () => {
                    const listaSensores = document.querySelectorAll(`#sensor-list-${idCamaraNumerico} .chamber-sensor`); 
                    if(listaSensores.length >= 5) {
                        adicionarSensorBtn.disabled = true;
                    } else {
                        adicionarSensorBtn.disabled = false;
                        sensorForm.reset();
                        sensorForm.dataset.editId = "";
                        sensorForm.querySelector(".sensor-form-title").innerText = "Cadastrar Novo Sensor";
                        alternarFormularioSensor(idCamaraNumerico);
                    }
                });


                // Cancelar
                sensorForm.querySelector(".btn-cancel-sensor")
                    .addEventListener("click", () => alternarFormularioSensor(idCamaraNumerico));

                // Enviar
                sensorForm.addEventListener("submit", (e) => {
                    e.preventDefault();
                    enviarFormularioSensor(sensorForm, idCamaraNumerico, chamberId);
                });

                carregarListaSensores(chamberId);
            });
        }

        function criarCardCamara(camara) {
            const { id_camara, local_instalacao, apelido, situacao } = camara;
            const chamberId = `c-${String(id_camara).padStart(2, "0")}`;
            const sensorFormId = `sensor-form-${id_camara}`;

            const card = document.createElement("li");
            card.classList.add("chamber");
            card.id = chamberId;
            card.dataset.chamberCard = "closed";
            card.innerHTML = gerarHTMLCard(chamberId, apelido, local_instalacao, situacao, status, id_camara, sensorFormId);

            return { card, chamberId };
        }

        function gerarHTMLCard(chamberId, apelido, localInstalacao, situacao, status, idCamara, sensorFormId) {
            return `
            <div class="chamber-header">
                <div class="chamber-info">
                    <p class="chamber-apelido">${apelido}</p>
                    <p class="chamber-local-instalacao">${localInstalacao}</p>
                </div>
                <div class="chamber-metrics">
                    <p class="chamber-situacao">● <span>${situacao}</span></p>
                    <p class="chamber-status">● <span></span></p>
                </div>
                <div class="chamber-actions">
                    <button id="chamber-toggler"><i class="fa-solid fa-chevron-down"></i></button>
                    <button id="chamber-edit-toggler" class="edit-chamber-btn" title="Editar Câmara">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </button>
                </div>
            </div>

            <div class="chamber-body">
                <ul class="chamber-kpi-list"></ul>

                <div class="chamber-main">
                    <div class="chamber-chart">
                        <div class="chart-title">
                            <h3>Variação de Etileno por Sensor</h3>
                            <div class="btn-group">
                                <button data-periodo="1" class="active">24hrs</button>
                                <button data-periodo="7">7 dias</button>
                                <button data-periodo="30">30 dias</button>
                            </div>
                        </div>
                        <canvas id="chart-${chamberId}"></canvas>
                    </div>

                    <div class="chamber-sensores-container">
                        <div class="sensores-header" style="margin-bottom: 10px;">
                            <button class="add-sensor-btn" data-chamber-id="${idCamara}">
                                <i class="fa-solid fa-plus"></i> Adicionar Sensor
                            </button>
                        </div>

                        <form id="${sensorFormId}" class="mini-sensor-form" style="display: none;" data-edit-id="" data-form-open="false">
                            <h4 class="sensor-form-title">Cadastrar Novo Sensor</h4>
                            <div class="sensor-form-fields" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;">
                                <div class="field">
                                    <label>Nº de Série</label>
                                    <input type="text" class="ipt-sensor-num-serie" placeholder="Ex: SN-1234" required>
                                </div>
                                <div class="field">
                                    <label>Modelo</label>
                                    <input type="text" class="ipt-sensor-modelo" placeholder="Ex: MQ-3" required>
                                </div>
                                <div class="field">
                                    <label>Data Instalação</label>
                                    <input type="date" class="ipt-sensor-data-instalacao" required>
                                </div>
                                <div class="field">
                                    <label>Situação</label>
                                    <select class="ipt-sensor-situacao" required>
                                        <option value="Ativo">Ativo</option>
                                        <option value="Inativo">Inativo</option>
                                    </select>
                                </div>
                            </div>
                            <div class="sensor-form-actions" style="display: flex; gap: 10px;">
                                <button type="button" class="btn-cancel-sensor">Cancelar</button>
                                <button type="submit" class="btn-submit-sensor">Salvar</button>
                            </div>
                        </form>

                        <ul class="chamber-sensores" id="sensor-list-${idCamara}"></ul>
                    </div>
                </div>
            </div>
        `;
        }


        function abrirEdicaoCamara(camara) {
            const form = document.getElementById("new-chamber-form");

            // Preenche Inputs com dados da Câmara
            document.getElementById("ipt-local-instalacao").value = camara.local_instalacao;
            // document.getElementById("ipt-observacao").value = camara.observacao || "";
            document.getElementById("ipt-apelido").value = camara.apelido;
            document.getElementById("ipt-volume").value = camara.volume;
            document.getElementById("ipt-kg-macas").value = camara.kg_macas;
            document.getElementById("ipt-situacao").value = camara.situacao;

            // Muda formulário para modo "edicao"
            form.dataset.editId = camara.id_camara;
            definirModoFormularioCamara("edicao", camara.apelido);

            if (form.dataset.formOpen === "false") {
                alternarFormularioCamara();
            }

            form.scrollIntoView({ behavior: "smooth" });
        }

        // === FORMULÁRIO SENSOR (CADASTRO/EDIÇÃO) === //
        function enviarFormularioSensor(form, idCamara, chamberId) {
            const editId = form.dataset.editId;
            const isEdicao = !!editId;
            const dados = {
                camara_id: idCamara,
                numero_sensor: form.querySelector(".ipt-sensor-num-serie").value,
                modelo: form.querySelector(".ipt-sensor-modelo").value,
                situacao: form.querySelector(".ipt-sensor-situacao").value,
                data_instalacao: form.querySelector(".ipt-sensor-data-instalacao").value
            };

            console.log(`Formulário de Sensor (${isEdicao ? "Edição" : "Cadastro"}) na câmara ${idCamara}:`, dados);
            fetch(`/sensores/${isEdicao ? `/atualizar/${editId}/${idCamara}` : "/cadastrar"}`, {
                method: isEdicao ? "PUT" : "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dados)
            })
            .then((res) => {
                if (!res.ok) {
                    throw new Error(`Erro ao Cadastrar Sensor na Câmara ${idCamara}!`);
                }

                // Fecha Formulário e Reseta Inputs
                alternarFormularioSensor(idCamara);
                form.reset();

                // Recarrego lista de Sensores na Câmara em específico
                carregarListaSensores(chamberId);
            })
            .catch((error) => {
                console.log(error);
                alert(`Tentativa de ${editId ? "atualizar" : "cadastrar"} sensor com nome em uso!`);
            });
        }

        // === LISTA SENSORES === //
        function carregarListaSensores(chamberId) {
            const idCamara = parseInt(chamberId.replace("c-", ""));
            const sensorList = document.querySelector(`#${chamberId} .chamber-sensores`);

            sensorList.innerHTML = "";
            fetch(`/sensores/listar/${idCamara}`)
                .then((res) => {
                    if (!res.ok) {
                        throw new Error(`Erro ao Carregar Sensores da Câmara ${idCamara}`);
                    }
                    return res.json();
                })
                .then((sensores) => {
                    sensores.forEach(sensor => {
                        const sensorCard = criarItemSensor(sensor, idCamara);
                        sensorList.appendChild(sensorCard);
                    });
                })
                .catch((error) => {
                    console.log(error)
                    // mostrar mensagem de erro...
                })
        }

        function criarItemSensor(sensor, idCamara) {
            const sensorItem = document.createElement("li");
            sensorItem.id = `sn-${sensor.id_sensor}`
            sensorItem.className = "chamber-sensor";
            sensorItem.innerHTML = `
            <div class="sensor-info">
                <p class="sensor-num-serie"><strong>N/S:</strong> ${sensor.numero_sensor}</p>
                <p class="sensor-modelo"><strong>Modelo:</strong> ${sensor.modelo}</p>
            </div>
            <div class="sensor-status-group">
                <p>● <span class="sensor-situacao">${sensor.situacao}</span></p>
                <button class="sensor-edit-btn" title="Editar Sensor">
                    <i class="fa-solid fa-pen-to-square"></i>
                </button>
            </div>
        `;

            sensorItem.querySelector(".sensor-edit-btn")
                .addEventListener("click", () => abrirEdicaoSensor(sensor, idCamara));

            return sensorItem;
        }

        function abrirEdicaoSensor(sensor, idCamara) {
            const form = document.getElementById(`sensor-form-${idCamara}`);

            form.querySelector(".ipt-sensor-num-serie").value = sensor.numero_sensor;
            form.querySelector(".ipt-sensor-modelo").value = sensor.modelo;
            form.querySelector(".ipt-sensor-situacao").value = sensor.situacao;
            form.querySelector(".ipt-sensor-data-instalacao").value = String(sensor.data_instalacao).split("T")[0];
            form.dataset.editId = sensor.id_sensor;
            form.querySelector(".sensor-form-title").innerText = `Editar Sensor: ${sensor.numero_sensor}`;

            if (form.dataset.formOpen === "false") {
                alternarFormularioSensor(idCamara);
            }

            form.scrollIntoView({ behavior: "smooth", block: "center" });
        }

        // === KPIs CÂMARA === //
        function carregarListaKPI(chamberId) {
            const kpiList = document.querySelector(`#${chamberId} .chamber-kpi-list`);
            const idCamaraNumerico = parseInt(chamberId.replace("c-", ""));

            fetch(`/medidas/buscar-detalhes-camaras/${idCamaraNumerico}`)
                .then((res) => {
                    if (!res.ok) {
                        throw new Error("Não foi Possível carregar os KPIs da Câmara");
                    }
                    return res.json()
                })
                .then((kpis) => {
                    const {etileno_atual, volume_m3, estoque_total_kg, preco_kg, estoque_em_risco_kg, ultima_leitura} = kpis;

                    const etilenoTratado = Number(etileno_atual).toFixed(1) || "Sem dados";
                    const volumeTratado = Number(volume_m3).toFixed(1) || "Sem dados";
                    const estoqueEmRiscoTratado = Number(estoque_em_risco_kg) || 0;

                    const estoqueEmUnidadesMacas = Math.round(estoque_total_kg / 0.15); // em média, maçãs gala pesam 150g cada
                    const receitaEstimadaCamara = 
                        Number(((estoque_total_kg - estoqueEmRiscoTratado) * preco_kg) || 0).toLocaleString('pt-br',{style: 'currency', currency: 'BRL'});

                    const statusCamara = etilenoTratado >= 2.0 
                        ? "Crítico" 
                        : etilenoTratado >= 1.5 
                            ? "Atenção" 
                            : "Sob Controle";

                    const etilenoAtualKPICor = etilenoTratado >= 2.0 
                        ? "negative" 
                        : etilenoTratado >= 1.5 
                            ? "caution" 
                            : "positive";

                    const estoqueEmRiscoKPICor = estoqueEmRiscoTratado >= (estoque_total_kg * 0.10) 
                        ? "negative" 
                        : estoqueEmRiscoTratado >= (estoque_total_kg * 0.05) 
                            ? "caution" 
                            : "positive";

                    // configura status da câmara
                    const camaraStatusDiv = document.querySelector(`#${chamberId} .chamber-status`);
                    if(camaraStatusDiv) {
                        camaraStatusDiv.textContent = statusCamara;
                        camaraStatusDiv.classList.remove('chamber-status--positive', 'chamber-status--caution', 'chamber-status--negative');
                        camaraStatusDiv.classList.add(`chamber-status--${etilenoAtualKPICor}`);
                    }

                    kpiList.innerHTML = `
                    <li class="chamber-kpi chamber-kpi--${etilenoAtualKPICor}">
                        <p class="chamber-kpi-caption">Etileno Atual (ppm)</p>
                        <h3 class="chamber-kpi-value">${etilenoTratado}</h3>
                        <span class="chamber-kpi-footer">última leitura: ${ultima_leitura || 'sem dados'}</span>
                    </li>
                    <li class="chamber-kpi chamber-kpi--positive">
                        <p class="chamber-kpi-caption">Volume Câmara (m³)</p>
                        <h3 class="chamber-kpi-value">${volumeTratado}</h3>
                    </li>
                    <li class="chamber-kpi chamber-kpi--${estoque_total_kg > 0 ? "positive" : "negative"}">
                        <p class="chamber-kpi-caption">Estoque Total (Kg)</p>
                        <h3 class="chamber-kpi-value">${estoque_total_kg}</h3>
                        <span class="chamber-kpi-footer">~${estoqueEmUnidadesMacas} maçãs</span>
                    </li>
                    <li class="chamber-kpi chamber-kpi--${estoqueEmRiscoKPICor}">
                        <p class="chamber-kpi-caption">Estoque em Risco (Kg)</p>
                        <h3 class="chamber-kpi-value">${estoqueEmRiscoTratado}</h3>
                        <span class="chamber-kpi-footer">Receita Estimada: ${receitaEstimadaCamara}</span>
                    </li>`;
                })
                .catch((error) => {
                    console.error(error);
                })
        }

        // === FUNÇÕES TOGGLER === //
        function alternarFormularioCamara() {
            const form = document.getElementById("new-chamber-form");
            const containerContent = document.querySelector(".chamber-container-content");
            const estaAberto = form.dataset.formOpen === "true";

            form.style.display = estaAberto ? "none" : "block";
            containerContent.style.display = estaAberto ? "block" : "none";
            form.dataset.formOpen = estaAberto ? "false" : "true";
        }

        function alternarVisibilidadeCamara(chamberId) {
            const card = document.getElementById(chamberId);
            const chevron = card.querySelector(".chamber-actions #chamber-toggler i");
            const estaAberto = card.dataset.chamberCard === "open";

            card.dataset.chamberCard = estaAberto ? "closed" : "open";
            chevron.classList.replace(
                estaAberto ? "fa-chevron-up" : "fa-chevron-down",
                estaAberto ? "fa-chevron-down" : "fa-chevron-up"
            );
        }

        function alternarFormularioSensor(idCamara) {
            const form = document.getElementById(`sensor-form-${idCamara}`);
            const estaAberto = form.dataset.formOpen === "true";

            form.style.display = estaAberto ? "none" : "block";
            form.dataset.formOpen = estaAberto ? "false" : "true";
        }
    </script>
</body>

</html>
