<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppleTech | Câmaras</title>

    <!-- ESTILOS DA DASHBOARD -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard/shared.css">
    <link rel="stylesheet" href="../css/dashboard/chambers.css">
    <link rel="shortcut icon" href="../assets/imgs/favicon.ico" type="image/x-icon">
    
    <!-- CDNs Chart.JS e FontAwesome -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="dashboard-container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <!-- SIDEBAR HEADER -->
            <div class="header">
                <img src="../assets/svgs/logo-recolored.svg" alt="AppleTech Logo" class="logo">
            </div>

            <!-- SIDEBAR NAVLIST -->
            <nav class="navlist">
                <div class="nav-section">
                    <h4>Menu</h4>
                    <a href="./home.html" class="navitem">
                        <i class="fa-solid fa-house"></i>
                        <span>Início</span>
                    </a>
                    <a href="#" class="navitem">
                        <i class="fa-solid fa-warehouse"></i>
                        <span>Câmaras</span>
                    </a>
                    <a href="./alerts.html" class="navitem">
                        <i class="fa-solid fa-warning"></i>
                        <span>Alertas</span>
                    </a>
                    <a href="./team.html" class="navitem">
                        <i class="fa-solid fa-user-group"></i>
                        <span>Equipe</span>
                    </a>
                </div>
                <div class="nav-section">
                    <h4>Outros</h4>
                    <a href="./help.html" class="navitem">
                        <i class="fa-solid fa-ear-listen"></i>
                        <span>Ajuda</span>
                    </a>
                </div>
            </nav>

            <!-- SIDEBAR FOOTER -->
            <div class="footer">
                <div class="logged-account">
                    <div>
                        <p id="account-username"></p>
                        <span id="account-role"></span>
                    </div>
                </div>
                <button id="logout-btn">
                    <i class="fa-solid fa-right-from-bracket" style="rotate: 180deg"></i>
                    <span>Sair</span>
                </button>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="content">
            <!-- CONTENT HEADER -->
            <div class="header">
                <h1>Dashboard - Câmaras</h1>
                <span id="current-date"></span>
            </div>

            <!-- CONTENT MAIN -->
            <main class="main">
                <div class="new-chamber-container">
                    <div class="chamber-container-content">
                        <img src="../assets/svgs/team-work.svg" alt="Nova Câmara">
                        <button class="new-chamber-btn" onclick="alternarVisibilidadeFormulario()">Nova Câmara<i class="fa-solid fa-plus"></i></button>
                    </div>
                    <form id="new-chamber-form" data-form-open="false" style="display: none;">
                        <div class="form-header"><h2>Adicionar Nova Câmara</h2></div>
                        <div class="form-body">
                            <div class="field-group">
                                <div class="field">
                                    <label for="ipt-local-instalacao" class="field-label">Local de Instalação <span>*</span></label>
                                    <input id="ipt-local-instalacao" type="text" class="field-input" placeholder="Ex: Ala Oeste" required>
                                </div>
                                <div class="field">
                                    <label for="ipt-observacao" class="field-label">Observação</label>
                                    <input id="ipt-observacao" type="text" class="field-input" placeholder="Ex: recém-instalada">
                                </div>
                                <div class="field">
                                    <label for="ipt-apelido" class="field-label">Apelido <span>*</span></label>
                                    <input id="ipt-apelido" type="text" class="field-input" placeholder="Ex: C-04" required>
                                </div>
                            </div>
                            <div class="field-group">
                                <div class="field">
                                    <label for="ipt-comprimento" class="field-label">Comprimento (m) <span>*</span></label>
                                    <input id="ipt-comprimento" type="number" class="field-input" required>
                                </div>
                                <div class="field">
                                    <label for="ipt-largura" class="field-label">Largura (m) <span>*</span></label>
                                    <input id="ipt-largura" type="number" class="field-input" required>
                                </div>
                                <div class="field">
                                    <label for="ipt-profundidade" class="field-label">Profundidade (m) <span>*</span></label>
                                    <input id="ipt-profundidade" type="number" class="field-input" required>
                                </div>
                                <div class="field">
                                    <label for="ipt-qtd-macas" class="field-label">Quantidade de Maçãs (Kg)<span>*</span></label>
                                    <input id="ipt-qtd-macas" type="number" class="field-input" required>
                                </div>
                            </div>
                        </div>
                        <div class="form-footer">
                            <button type="reset" onclick="alternarVisibilidadeFormulario()">Cancelar</button>
                            <button type="submit" onclick="adicionarNovaCamara()">Adicionar</button>
                        </div>
                    </form>
                </div>

                <div class="chamber-list-results">
                    <h1>Total de Câmaras</h1>
                    <span>5</span>
                </div>

                <ul class="chamber-list">
                    <!-- CHAMBERS carregadas dinamicamente -->
                </ul>
            </main>
        </div>
    </div>

<script src="../scripts/utils/mock-user.js"></script>
<script src="../scripts/toggle-camara.js"></script>
<script src="../scripts/utils/formatar-data.js"></script>
<script>
    document.getElementById("current-date").innerText = formatarDataAtual();

    const novaCamaraForm = document.getElementById("new-chamber-form");
    function alternarVisibilidadeFormulario() {
        const containerContent = document.querySelector(".chamber-container-content");
        const aberto = novaCamaraForm.dataset.formOpen;
        if(aberto === 'true') {
            novaCamaraForm.style.display = "none";
            containerContent.style.display = "block";
            novaCamaraForm.dataset.formOpen = false;
        } else {
            novaCamaraForm.style.display = "block";
            containerContent.style.display = "none";
            novaCamaraForm.dataset.formOpen = true;
        }
    }

    // Gráficos
    const graficos = [];
    const chartLabels = {
        '24h': ['00:00', '03:00', '06:00', '09:00', '12:00', '15:00', '18:00', '21:00', '23:59'],
        '7d': ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sab', 'Dom'],
        '30d': ['Semana 1', 'Semana 2', 'Semana 3', 'Semana 4']
    }
    const chambers = [
        {
            id: 1,
            apelido: "C-01",
            localInstalacao: "Câmara ao lado do frigorífico.",
            largura: 3, comprimento: 2, profundidade: 8,
            situacao: "Ativo", status: "Sob Controle", qtdMacas: 500,
            dataset: {
                '24h': [1.0, 1.2, 0.9, 1.1, 1.0, 1.2, 0.8, 1.0, 1.1],
                '7d': [1.2, 1.1, 0.9, 1.0, 1.2, 1.0, 1.1],
                '30d': [1.0, 1.2, 0.9, 1.1]
            }
        },
        {
            id: 2,
            apelido: "C-02",
            localInstalacao: "Câmara recém-instalada",
            largura: 3, comprimento: 2, profundidade: 8,
            situacao: "Ativo", status: "Sob Controle", qtdMacas: 500,
            dataset: {
                '24h': [0.9, 0.8, 1.0, 1.1, 0.9, 1.0, 0.8, 1.1, 1.0],
                '7d': [1.0, 0.8, 0.9, 1.1, 1.0, 0.8, 1.0],
                '30d': [1.1, 0.9, 1.2, 1.0]
            }
        },
        {
            id: 3,
            apelido: "C-03",
            localInstalacao: "Câmara ala Leste",
            largura: 3, comprimento: 2, profundidade: 8,
            situacao: "Ativo", status: "Atenção", qtdMacas: 300,
            dataset: {
                '24h': [1.3, 1.2, 1.5, 1.6, 1.4, 1.5, 1.7, 1.6, 1.8],
                '7d': [1.3, 1.2, 1.5, 1.6, 1.7, 1.4, 1.8],
                '30d': [1.3, 1.2, 1.5, 1.8]
            }
        },
        {
            id: 4,
            apelido: "C-04",
            localInstalacao: "Câmara ao lado do frigorífico",
            largura: 3, comprimento: 2, profundidade: 8,
            situacao: "Ativo", status: "Sob Controle", qtdMacas: 200,
            dataset: {
                '24h': [1.1, 1.4, 1.0, 1.2, 1.3, 1.1, 1.0, 1.2, 1.2],
                '7d': [1.1, 1.4, 1.0, 1.2, 1.1, 1.0, 1.2],
                '30d': [1.1, 1.4, 1.0, 1.2]
            }
        },
        {
            id: 5,
            apelido: "C-05",
            localInstalacao: "Câmara ala Oeste",
            largura: 3, comprimento: 2, profundidade: 8,
            situacao: "Ativo", status: "Crítico", qtdMacas: 500,
            dataset: {
                '24h': [1.5, 1.3, 1.8, 1.8, 1.9, 1.7, 2.0, 1.8, 2.0],
                '7d': [1.5, 1.3, 1.8, 1.8, 1.9, 1.7, 2.0],
                '30d': [1.5, 1.3, 1.8, 2.0]
            }
        }
    ];

    const chambersList = document.querySelector(".chamber-list");
    function carregarDadosCamaras() {
        for (let i = 0; i < chambers.length; i++) {
            const chamber = chambers[i];
            const chamberId = `c-${String(chamber.id).padStart(2, "0")}`;
            const chamberCard = document.createElement("li");


            chamberCard.classList.add("chamber");
            chamberCard.id = chamberId;
            chamberCard.dataset.chamberCard = "closed";

            const volume = Math.round(chamber.comprimento * chamber.profundidade * chamber.largura);
            const unidadeMacas = Math.round(chamber.qtdMacas / 0.150); // 0.150 = 150g

            const ultimaLeitura = chamber.dataset['24h'][chamber.dataset['24h'].length - 1];
            const estoqueEmRisco = ultimaLeitura >= 1.5 ? Math.round(chamber.qtdMacas * (ultimaLeitura/10)) : 0; // só aplicamos este cálculo para câmaras acima ou em 1.5ppm

            const tipoBadge = 
                chamber.status === "Sob Controle" ? "common" :
                chamber.status === "Atenção" ? "caution" : "serious";

            chamberCard.innerHTML = `
                <!-- CHAMBER HEADER -->
                <div class="chamber-header">
                    <button class="chamber-toggler" onclick="alternarVisibilidadeCamara('${chamberId}')"><i class="fa-solid fa-chevron-down"></i></button>
                    <div>
                        <h3>${chamber.apelido}</h3>
                        <p>${chamber.localInstalacao}</p>
                    </div>
                    <div>
                        <p>Status</p>
                        <span class="badge" data-badge-type="common">● ${chamber.situacao}</span>
                    </div>
                    <div>
                        <p>Situação</p>
                        <span class="badge" data-badge-type="${tipoBadge}">● ${chamber.status}</span>
                    </div>
                    <div>
                        <p>Última Leitura</p>
                        <span>1min atrás</span>
                    </div>
                </div>
                <!-- CHAMBER CONTENT -->
                <div class="chamber-content">
                    <!-- CHAMBER GRAPH -->
                    <div class="chamber-graph">
                        <div>
                            <h3 class="chamber-graph-title">Variação de Etileno - <span>${chamber.apelido}</span></h3>
                            <div class="btn-group btn-group--${chamberId}">
                                <button data-periodo="24h"onclick="atualizarPeriodo('24h', '${chamberId}')" class="active">24hrs</button>
                                <button data-periodo="7d" onclick="atualizarPeriodo('7d', '${chamberId}')">7 dias</button>
                                <button data-periodo="30d"onclick="atualizarPeriodo('30d', '${chamberId}')">30 dias</button>
                            </div>
                        </div>
                        <canvas id="${chamberId}-graph"></canvas>
                    </div>

                    <!-- CHAMBER EXTRA -->
                    <div class="chamber-extra">
                        <div class="chamber-card">
                            <p class="chamber-card-title">Etileno Atual</p>
                            <h3 class="chamber-card-value chamber-card-value--${ultimaLeitura >= 1.5 ? "negative" : "positive"}">${Number(ultimaLeitura).toFixed(1)} <span>ppm</span></h3>
                        </div>
                        <div class="chamber-card">
                            <p class="chamber-card-title">Volume Câmara</p>
                            <h3 class="chamber-card-value">${volume} <span>m³</span></h3>
                        </div>
                        <div class="chamber-card">
                            <p class="chamber-card-title">Estoque Total</p>
                            <h3 class="chamber-card-value">${chamber.qtdMacas}kg <span>~${Math.round(chamber.qtdMacas / 0.150)} maçãs</span></h3>
                        </div>
                        <div class="chamber-card">
                            <p class="chamber-card-title">Estoque em Risco</p>
                            <h3 class="chamber-card-value chamber-card-value--${estoqueEmRisco !== 0 ? "negative" : "positive"}">${estoqueEmRisco}kg <span>Receita estimada: ${Number(estoqueEmRisco * 13.5).toLocaleString('pt-br',{style: 'currency', currency: 'BRL'})}</span></h3>
                        </div>
                    </div>
                </div>
            `;
            chambersList.appendChild(chamberCard);
        }
    }

    function inicializarGraficos() {
        chambers.forEach(chamber => {
            const chamberId = `c-${String(chamber.id).padStart(2, "0")}`;
            const ctx = document.getElementById(`${chamberId}-graph`);

            if (ctx) {
                graficos[chamberId] = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: chartLabels['24h'],
                        datasets: [{
                            label: 'Etileno (ppm)',
                            data: chamber.dataset['24h'],
                            borderColor: '#7A9B55',
                            backgroundColor: 'rgba(122, 155, 85, 0.2)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 4,
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            annotation: {
                                annotations: {
                                    limiteCritico: {
                                        type: 'line',
                                        yMin: 1.5, yMax: 1.5,
                                        borderColor: '#B83232',
                                        borderWidth: 3,
                                        label: {
                                            display: true,
                                            content: 'Limite Crítico (1.5 ppm)',
                                            position: 'end',
                                            backgroundColor: 'rgba(184, 50, 50, 0.8)',
                                            color: '#fff',
                                            font: { size: 12, weight: 'bold' }
                                        }
                                    }
                                }
                            }
                        },
                        scales: { y: { min: 0, max: 3 } }
                    }
                });
            }
        });
    }

    function atualizarPeriodo(periodo, idChamber) {
        const idNumerico = parseInt(idChamber.replace('c-', ''));   // trata id dos cards: "c-01" vira 1
        const chamber = chambers.find(c => c.id === idNumerico);
        const grafico = graficos[idChamber];

        if (!grafico || !chamber) return;

        grafico.data.labels = chartLabels[periodo];
        grafico.data.datasets[0].data = chamber.dataset[periodo];
        grafico.update();

        const btnGroup = document.querySelectorAll(`.btn-group--${idChamber} button`);
        btnGroup.forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-periodo') === periodo) {
                btn.classList.add('active');
            }
        });
    }

    // Carrega e inicializa dinamicamente os cards e os gráficos das camaras
    document.addEventListener("DOMContentLoaded", () => {
        carregarDadosCamaras();
        inicializarGraficos();
    });

</script>
</body>
</html>
