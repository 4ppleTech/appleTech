<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppleTech | Equipe</title>

    <!-- ESTILOS DA DASHBOARD -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard/shared.css">
    <link rel="stylesheet" href="../css/dashboard/team.css">
    <link rel="shortcut icon" href="../assets/imgs/favicon.ico" type="image/x-icon">
    
    <!-- CDNs Chart.JS e FontAwesome -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="dashboard-container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <!-- SIDEBAR HEADER -->
            <div class="header">
                <img src="../assets/svgs/logo-recolored.svg" alt="AppleTech Logo" class="logo">
            </div>

            <!-- SIDEBAR NAVLIST -->
            <nav class="navlist">
                <div class="nav-section">
                    <h4>Menu</h4>
                    <a href="./home.html" class="navitem">
                        <i class="fa-solid fa-house"></i>
                        <span>Início</span>
                    </a>
                    <a href="./chambers.html" class="navitem">
                        <i class="fa-solid fa-warehouse"></i>
                        <span>Câmaras</span>
                    </a>
                    <a href="./alerts.html" class="navitem">
                        <i class="fa-solid fa-warning"></i>
                        <span>Alertas</span>
                    </a>
                    <a href="#" class="navitem">
                        <i class="fa-solid fa-user-group"></i>
                        <span>Equipe</span>
                    </a>
                </div>
                <div class="nav-section">
                    <h4>Outros</h4>

                    <a href="./help.html" class="navitem">
                        <i class="fa-solid fa-ear-listen"></i>
                        <span>Ajuda</span>
                    </a>
                </div>
            </nav>

            <!-- SIDEBAR FOOTER -->
            <div class="footer">
                <div class="logged-account">
                    <div>
                        <p id="account-username"></p>
                        <span id="account-role"></span>
                    </div>
                </div>
                <button id="logout-btn" onclick="limparSessao()">
                    <i class="fa-solid fa-right-from-bracket" style="rotate: 180deg"></i>
                    <span>Sair</span>
                </button>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="content">
            <!-- CONTENT HEADER -->
            <div class="header">
                <h1>Dashboard - Equipe</h1>
                <span id="current-date"></span>
            </div>

            <!-- CONTENT MAIN -->
            <main class="main">
                <!-- COMPANY INFO -->
                <div class="company-info">
                    <h3>Informações da Empresa</h3>
                    <div class="info-header">
                        <h4 id="nome_fantasia" class="nome-fantasia">Carregando...</h4>
                        <h1 id="razao_social" class="razao-social">Carregando...</h1>
                        <p id="cnpj" class="cnpj">XX.XXX.XXX/XXXX-XX</p>
                    </div>
                    
                    <!-- COMPANY CODE -->
                    <div class="info-code">
                        <h3>Código de Ativação</h3>
                        <div class="code-input">
                            <input id="inCompanyCode" type="password" disabled value="">
                            <button onclick="verSenha()" id="btn-olho"><i class="fa-solid fa-eye-slash"></i></button>
                        </div>
                    </div>
                </div>
                
                <!-- CURRENT USERS -->
                <ul id="member_list" class="member-list">
                    <div class="member-list-results">
                        <h3>Membros da Equipe</h3>
                        <span id="membros_equipe">0</span>
                    </div>
                    
                    <li class="member-card">
                        <div class="member-card-content">
                            <div>

                                <p id = "username" class="username">Usuario X</p>
                                <p id = "email" class="email">xxxxx@xxxx.com</p>
                            </div>
                            <p id = "papel_usuario" class="role">xxxxxxx</p>
                        </div>  
                        <div class="member-card-action">
                            <select id="select_papel">   
                                 <option value="" disabled selected hidden>Selecione uma opção</option>
                                <option value="administrador">Administrador</option>
                                <option value="analista">Analista</option>
                            </select>
                            <button id = "btn_salvar">Salvar</button>
                        </div>
                    </li>
                </ul>
            </main>
        </div>
    </div>

<script src="../scripts/utils/formatar-data.js"></script>
<script type="module">
   import { load_account } from "../scripts/utils/load_account.js";

document.addEventListener("DOMContentLoaded", () => {
    load_account();

    const user = JSON.parse(sessionStorage.getItem("APPLETECH_USER"));
    document.getElementById("account-username").innerText = user.nome;
    document.getElementById("account-role").innerText = user.papel_usuario;

    const campoData = document.getElementById("current-date");
    if (campoData) campoData.innerText = formatarDataAtual();

    buscarDadosEmpresa();
    buscarUsuario();

});

function buscarDadosEmpresa() {
    let sessaousuario = JSON.parse(sessionStorage.getItem("APPLETECH_USER"));
    let idEmpresa = sessaousuario.empresaId;
    

    let souAdmin = sessaousuario.papel_usuario === "administrador";


    fetch(`/empresas/listar/`).then((resposta) => {
        if(resposta.ok){
            resposta.json().then((dados) => {
                let inputCodigo = document.getElementById("inCompanyCode");
                let btnOlho = document.getElementById("btn-olho");

                if (souAdmin) {
                    inputCodigo.value = dados[0].codigo_ativacao;
                } else {
                    inputCodigo.value = "********";
                    btnOlho.style.display = "none"; 
                }

                nome_fantasia.innerHTML = dados[0].nome_fantasia;
                razao_social.innerHTML = dados[0].razao_social;
                cnpj.innerHTML = dados[0].cnpj;
            })
        }
    })
}

function buscarUsuario(){
    let sessaousuario = JSON.parse(sessionStorage.getItem("APPLETECH_USER"));
    let idEmpresa = sessaousuario.empresaId;

    fetch(`/usuarios/buscar-empresa/${idEmpresa}`).then((resposta) => {
        if(resposta.ok){
            resposta.json().then((dados) => {
                mostrarEquipe(dados);
            })
        }
    })
}

function mostrarEquipe(dados){
    let sessaousuario = JSON.parse(sessionStorage.getItem("APPLETECH_USER"));
    let souAdmin = sessaousuario.papel_usuario === "administrador";

    member_list.innerHTML = `
        <div class="member-list-results">
            <h3>Membros da Equipe</h3>
            <span id="membros_equipe">${dados.length}</span>
        </div>
    `;

    dados.forEach((valor) => {
        let desabilitar
        let estilobotao
        if(souAdmin){
            desabilitar = ""
            estilobotao = ""
        }else{
            desabilitar = "disabled"
            estilobotao = "style='opacity:0.5; cursor:not-allowed'"
        }


        member_list.innerHTML += `
        <li class="member-card">
            <div class="member-card-content">
                <div class="member-info">
                    <div class="user-details">
                        <p class="username">${valor.nome}</p>
                        <p class="email">${valor.email}</p>
                    </div>
                    <p class="role" id="role_display_${valor.id_usuario}">${valor.papel_usuario}</p>
                </div>
            </div>
            <div class="member-card-action">
                <select id="select_papel_${valor.id_usuario}" ${desabilitar}>
                    <option value="administrador" ${valor.papel_usuario == 'administrador' ? 'selected' : ''}>Administrador</option>
                    <option value="analista" ${valor.papel_usuario == 'analista' ? 'selected' : ''}>Analista</option>
                </select>
                <button onclick="salvarAlteracao(${valor.id_usuario})" ${desabilitar} ${estilobotao}>
                    Salvar
                </button>
            </div>
        </li>`;
    });
}

function salvarAlteracao(usuario) {
    let novoPapel = document.getElementById(`select_papel_${usuario}`).value;
    let sessaousuario = JSON.parse(sessionStorage.getItem("APPLETECH_USER"));


    fetch(`/usuarios/alterar-permissao/${usuario}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ papel_usuario: novoPapel })
    })
    .then(resposta => {
        if (resposta.ok) {
            let display = document.getElementById(`role_display_${usuario}`);
            display.innerHTML = novoPapel;

           
            if (usuario == sessaousuario.id_usuario) {
                sessaousuario.papel_usuario = novoPapel;
                sessionStorage.setItem("APPLETECH_USER", JSON.stringify(sessaousuario));
                
               
            }

            alert("Cargo atualizado");

          
           
        } 
    })
    .catch(erro => console.error("Erro no fetch:", erro))
}

window.salvarAlteracao = salvarAlteracao;


function verSenha() {
    var input = document.getElementById("inCompanyCode");
    var icone = document.querySelector("#btn-olho i");

    if (input.type === "password") {
        input.type = "text";
        icone.className = "fa-solid fa-eye";
    } else {
        input.type = "password";
        icone.className = "fa-solid fa-eye-slash";
        
    }
}

window.verSenha = verSenha;
</script>
<script src="../scripts/utils/sessao.js"></script>
</body>
</html>
