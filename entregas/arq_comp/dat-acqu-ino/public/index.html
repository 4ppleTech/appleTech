<!doctype html>
<html>

<head>
    <title>Graphics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <h1>Captura de Dados</h1>
    <div style="display: flex;">
        <div style="width: 100%;">
            <canvas id="percentual_gas"></canvas>
        </div>
        <div style="width: 50%;">
            <canvas id="valor_gas"></canvas>
        </div>
    </div>

    <script>
        var percentual_gas = new Chart(document.getElementById('percentual_gas').getContext('2d'), {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Valor Etileno (ppm)',
                    borderColor: '#7A9B55',
                    backgroundColor: '#B83232'
                }]
            },
            options: {
                scales: {
                    x: {
                        beginAtZero: true
                    },
                    y: {
                        title: {
                            display: true,
                            text: '(ppm)'
                        },
                        beginAtZero: true,
                    },
                },
            }
        });

        var paginacao = {};
        var tempo = {};

        function obterDados(grafico, endpoint) {
            fetch('http://localhost:3300/sensores/' + endpoint)
                .then(response => response.json())
                .then(valores => {
                    if (paginacao[endpoint] == null) {
                        paginacao[endpoint] = 0;
                    }
                    if (tempo[endpoint] == null) {
                        tempo[endpoint] = 0;
                    }

                    var ultimaPaginacao = paginacao[endpoint];
                    paginacao[endpoint] = valores.length;
                    valores = valores.slice(ultimaPaginacao);

                    valores.forEach((valor) => {
                        if (grafico.data.labels.length == 10 && grafico.data.datasets[0].data.length == 10) {
                            grafico.data.labels.shift();
                            grafico.data.datasets[0].data.shift();
                        }

                        grafico.data.labels.push(tempo[endpoint]++);
                        grafico.data.datasets[0].data.push(parseFloat(valor));
                        grafico.update();
                    });
                })
                .catch(error => console.error('Erro ao obter dados:', error));
        }

        setInterval(() => {
            obterDados(percentual_gas, 'percentual');
            obterDados(valor_gas, 'valor');
        }, 1000);

    </script>
</body>

</html>
